name: Smart Library CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_library_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d smart_library_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PYTHONPATH: ${{ github.workspace }}/backend

      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: smart_library_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

      TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/smart_library_test

      SECRET_KEY: ci-only-secret-key-not-for-production

      TEST_ADMIN_PASSWORD: CiAdmin123!
      TEST_LIBRARIAN_PASSWORD: CiLibrarian123!
      TEST_MEMBER_PASSWORD: CiMember123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8001
        run: npm run build